[package]
name = "aio-plugin-settings"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
aio-plugin-identity-client = { git = "https://github.com/zjarlin/aio-plugin-identity.git", rev = "e1a022f7906fcab17a6839bfc5fed9904500e574" }
az-dioxus-admin-shell = { git = "https://github.com/zjarlin/dioxus-admin-workbench.git", rev = "11c0d3856e541e3421854a2a96e995ba02546c3a" }
az-ui-components = { git = "https://github.com/zjarlin/dioxus-admin-workbench.git", rev = "11c0d3856e541e3421854a2a96e995ba02546c3a" }
dill = "0.15.0"
dioxus = { version = "=0.7.9", default-features = false, features = ["macro", "html", "signals"] }
serde_json = "1.0.145"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = { version = "0.6.0", features = ["http"] }

[lints.rust]
unsafe_code = "forbid"
