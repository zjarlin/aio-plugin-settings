[package]
name = "aio-plugin-settings"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
aio-plugin-identity-model = { git = "https://github.com/zjarlin/aio-plugin-identity.git", rev = "636871e3ad3f7fc644d17aeded5a80e7623aeeae" }
az-dioxus-admin-shell = { git = "https://github.com/zjarlin/dioxus-admin-workbench.git", rev = "e30ae344a4988ba0ac40131f115b266cfaf62135" }
az-ui-components = { git = "https://github.com/zjarlin/dioxus-admin-workbench.git", rev = "e30ae344a4988ba0ac40131f115b266cfaf62135" }
dill = "0.15.0"
dioxus = { version = "=0.7.9", default-features = false, features = ["macro", "html", "signals"] }
serde_json = "1.0.145"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = { version = "0.6.0", features = ["http"] }

[lints.rust]
unsafe_code = "forbid"
